<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily AI/Dev Brief - 2026-05-22</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #607080;
      --line: #d9e0e7;
      --accent: #0b6bcb;
      --accent-bg: #e8f2ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101316;
        --panel: #181d22;
        --text: #edf1f5;
        --muted: #a7b2bd;
        --line: #2a333c;
        --accent: #74b7ff;
        --accent-bg: #17293a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }
    header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
      padding-bottom: 22px;
    }
    .badge {
      display: inline-block;
      background: var(--accent-bg);
      color: var(--accent);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.12;
      margin: 0 0 10px;
      letter-spacing: 0;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
    }
    article {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 28px;
    }
    h2 {
      border-top: 1px solid var(--line);
      font-size: 22px;
      margin: 30px 0 12px;
      padding-top: 22px;
      letter-spacing: 0;
    }
    h3 {
      font-size: 18px;
      margin: 22px 0 8px;
      letter-spacing: 0;
    }
    h2:first-child {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }
    strong {
      font-weight: 750;
    }
    ul {
      padding-left: 22px;
      margin: 10px 0 18px;
    }
    li { margin: 8px 0; }
    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .sources {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
    }
    @media print {
      body { background: #fff; }
      main { padding: 0; }
      article { border: 0; padding: 0; }
      a { color: #000; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="badge">Daily Brief</div>
      <h1>AI, 개발 이슈, 개발 도구 브리프</h1>
      <div class="meta">기간: 2026-05-21 - 2026-05-22 (Asia/Seoul) · 생성: 2026-05-22 09:02 · 수집 항목: 131개</div>
    </header>
    <article>
      <h2>신뢰도 메모</h2>
<p>Gemini 요약 생성에 실패했습니다: `HTTP Error 503: Service Unavailable`</p>
    </article>
    <div class="sources">Generated by <code>weekly_brief.py</code>. Public feeds, Hacker News, and configured GitHub releases were used as evidence.</div>
  </main>
</body>
</html>
