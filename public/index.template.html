<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly AI/Dev Brief</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667586;
      --line: #d9e1ea;
      --accent: #0b6bcb;
      --shadow: rgba(18, 26, 34, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101316;
        --panel: #181d22;
        --text: #edf1f5;
        --muted: #a7b2bd;
        --line: #2a333c;
        --accent: #74b7ff;
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 22px 16px;
    }
    main {
      min-width: 0;
      padding: 30px 24px 48px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      padding-bottom: 16px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.14;
      letter-spacing: 0;
      margin: 0;
    }
    .menu {
      display: none;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .list,
    .brief-grid {
      display: grid;
      gap: 8px;
    }
    .brief-link,
    .brief-card {
      display: block;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 12px;
      text-align: left;
      text-decoration: none;
    }
    .brief-link:hover,
    .brief-card:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .brief-link span,
    .brief-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      margin-top: 2px;
    }
    .intro {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 12px;
      color: var(--muted);
    }
    .empty {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
    }
    .backdrop {
      display: none;
    }
    @media (max-width: 760px) {
      .shell { display: block; }
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(320px, 86vw);
        z-index: 20;
        transform: translateX(-100%);
        transition: transform 180ms ease;
        box-shadow: 12px 0 30px var(--shadow);
      }
      body.nav-open aside { transform: translateX(0); }
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.36);
      }
      body.nav-open .backdrop { display: block; }
      main { padding: 18px 14px 32px; }
      .menu {
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside aria-label="저장된 브리프">
      <p class="eyebrow">최근 4주</p>
      <nav id="brief-list" class="list"></nav>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <main>
      <header>
        <button id="menu" class="menu" type="button" aria-label="브리프 목록 열기">☰</button>
        <h1>AI, 개발 이슈, 개발 도구 주간 브리프</h1>
      </header>
      <section>
        <div class="intro">브리프는 새 탭에서 열립니다. 모바일에서는 왼쪽 메뉴에서 최근 4주 브리프를 선택할 수 있습니다.</div>
        <div id="brief-grid" class="brief-grid"></div>
      </section>
    </main>
  </div>
  <script>
    const briefs = __BRIEFS_JSON__;
    const list = document.getElementById('brief-list');
    const grid = document.getElementById('brief-grid');
    const menu = document.getElementById('menu');
    const backdrop = document.getElementById('backdrop');

    function setNav(open) {
      document.body.classList.toggle('nav-open', open);
    }

    function briefAnchor(brief, className) {
      const anchor = document.createElement('a');
      anchor.className = className;
      anchor.href = brief.htmlUrl;
      anchor.target = '_blank';
      anchor.rel = 'noreferrer';
      anchor.innerHTML = `${brief.stamp}<span>새 탭에서 열기</span>`;
      anchor.addEventListener('click', () => setNav(false));
      return anchor;
    }

    function renderList() {
      if (!briefs.length) {
        list.innerHTML = '<div class="empty">아직 생성된 브리프가 없습니다. Actions를 수동 실행하거나 첫 예약 실행을 기다리세요.</div>';
        grid.innerHTML = '<div class="empty">아직 생성된 브리프가 없습니다.</div>';
        return;
      }
      briefs.forEach((brief) => {
        list.appendChild(briefAnchor(brief, 'brief-link'));
        grid.appendChild(briefAnchor(brief, 'brief-card'));
      });
    }

    menu.addEventListener('click', () => setNav(true));
    backdrop.addEventListener('click', () => setNav(false));
    renderList();
  </script>
</body>
</html>
