<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly AI/Dev Brief</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667586;
      --line: #d9e1ea;
      --accent: #0b6bcb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101316;
        --panel: #181d22;
        --text: #edf1f5;
        --muted: #a7b2bd;
        --line: #2a333c;
        --accent: #74b7ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 42px 20px 72px;
    }
    header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
      padding-bottom: 20px;
    }
    h1 {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.14;
      letter-spacing: 0;
      margin: 0 0 8px;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
    }
    .viewer {
      min-height: 320px;
    }
    iframe {
      width: 100%;
      min-height: 80vh;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .empty,
    .error {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
    }
    a {
      color: var(--accent);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI, 개발 이슈, 개발 도구 주간 브리프</h1>
      <div class="meta">페이지를 열 때마다 최신 데이터를 수집해 보여줍니다. Vercel Cron은 매주 일요일 09:00 KST에 같은 경로를 호출합니다.</div>
    </header>
    <section id="viewer" class="viewer">
      <div class="empty">최신 브리프를 불러오는 중입니다.</div>
    </section>
  </main>
  <script>
    const viewer = document.getElementById('viewer');

    fetch('/api/cron', { headers: { accept: 'application/json' } })
      .then((response) => response.json())
      .then((data) => {
        if (!data.ok) throw new Error(data.error || '브리프를 불러오지 못했습니다.');
        const iframe = document.createElement('iframe');
        iframe.title = 'Latest weekly AI and developer brief';
        iframe.srcdoc = data.html;
        viewer.replaceChildren(iframe);
      })
      .catch((error) => {
        viewer.innerHTML = `<div class="error">${error.message}</div>`;
      });
  </script>
</body>
</html>
