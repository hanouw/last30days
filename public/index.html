<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily AI/Dev Brief</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667586;
      --line: #d9e1ea;
      --accent: #0b6bcb;
      --shadow: rgba(18, 26, 34, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101316;
        --panel: #181d22;
        --text: #edf1f5;
        --muted: #a7b2bd;
        --line: #2a333c;
        --accent: #74b7ff;
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 22px 16px;
    }
    main {
      min-width: 0;
      padding: 30px 24px 48px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 18px;
      padding-bottom: 16px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.14;
      letter-spacing: 0;
      margin: 0;
    }
    .menu {
      display: none;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 12px;
    }
    .list {
      display: grid;
      gap: 8px;
    }
    .brief-link {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      padding: 12px;
      text-align: left;
    }
    .brief-link[aria-current="true"] {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    .brief-link span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      margin-top: 2px;
    }
    iframe {
      width: 100%;
      min-height: calc(100vh - 112px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .empty {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      color: var(--muted);
    }
    .backdrop { display: none; }
    @media (max-width: 760px) {
      .shell { display: block; }
      aside {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(320px, 86vw);
        z-index: 20;
        transform: translateX(-100%);
        transition: transform 180ms ease;
        box-shadow: 12px 0 30px var(--shadow);
      }
      body.nav-open aside { transform: translateX(0); }
      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: rgba(0, 0, 0, 0.36);
      }
      body.nav-open .backdrop { display: block; }
      main { padding: 18px 14px 32px; }
      .menu {
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
      }
      iframe { min-height: calc(100vh - 92px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside aria-label="저장된 브리프">
      <p class="eyebrow">최근 28개</p>
      <nav id="brief-list" class="list"></nav>
    </aside>
    <div id="backdrop" class="backdrop"></div>
    <main>
      <header>
        <button id="menu" class="menu" type="button" aria-label="브리프 목록 열기">☰</button>
        <h1>AI, 개발 이슈, 개발 도구 일간 브리프</h1>
      </header>
      <section id="viewer"></section>
    </main>
  </div>
  <script>
    const briefs = [{"stamp": "2026-06-24", "title": "Daily AI/Dev Brief - 2026-06-24", "htmlUrl": "briefs/2026-06-24.html"}, {"stamp": "2026-06-23", "title": "Daily AI/Dev Brief - 2026-06-23", "htmlUrl": "briefs/2026-06-23.html"}, {"stamp": "2026-06-22", "title": "Daily AI/Dev Brief - 2026-06-22", "htmlUrl": "briefs/2026-06-22.html"}, {"stamp": "2026-06-21", "title": "Daily AI/Dev Brief - 2026-06-21", "htmlUrl": "briefs/2026-06-21.html"}, {"stamp": "2026-06-20", "title": "Daily AI/Dev Brief - 2026-06-20", "htmlUrl": "briefs/2026-06-20.html"}, {"stamp": "2026-06-19", "title": "Daily AI/Dev Brief - 2026-06-19", "htmlUrl": "briefs/2026-06-19.html"}, {"stamp": "2026-06-18", "title": "Daily AI/Dev Brief - 2026-06-18", "htmlUrl": "briefs/2026-06-18.html"}, {"stamp": "2026-06-17", "title": "Daily AI/Dev Brief - 2026-06-17", "htmlUrl": "briefs/2026-06-17.html"}, {"stamp": "2026-06-16", "title": "Daily AI/Dev Brief - 2026-06-16", "htmlUrl": "briefs/2026-06-16.html"}, {"stamp": "2026-06-15", "title": "Daily AI/Dev Brief - 2026-06-15", "htmlUrl": "briefs/2026-06-15.html"}, {"stamp": "2026-06-14", "title": "Daily AI/Dev Brief - 2026-06-14", "htmlUrl": "briefs/2026-06-14.html"}, {"stamp": "2026-06-13", "title": "Daily AI/Dev Brief - 2026-06-13", "htmlUrl": "briefs/2026-06-13.html"}, {"stamp": "2026-06-12", "title": "Daily AI/Dev Brief - 2026-06-12", "htmlUrl": "briefs/2026-06-12.html"}, {"stamp": "2026-06-11", "title": "Daily AI/Dev Brief - 2026-06-11", "htmlUrl": "briefs/2026-06-11.html"}, {"stamp": "2026-06-10", "title": "Daily AI/Dev Brief - 2026-06-10", "htmlUrl": "briefs/2026-06-10.html"}, {"stamp": "2026-06-09", "title": "Daily AI/Dev Brief - 2026-06-09", "htmlUrl": "briefs/2026-06-09.html"}, {"stamp": "2026-06-08", "title": "Daily AI/Dev Brief - 2026-06-08", "htmlUrl": "briefs/2026-06-08.html"}, {"stamp": "2026-06-07", "title": "Daily AI/Dev Brief - 2026-06-07", "htmlUrl": "briefs/2026-06-07.html"}, {"stamp": "2026-06-06", "title": "Daily AI/Dev Brief - 2026-06-06", "htmlUrl": "briefs/2026-06-06.html"}, {"stamp": "2026-06-05", "title": "Daily AI/Dev Brief - 2026-06-05", "htmlUrl": "briefs/2026-06-05.html"}, {"stamp": "2026-06-04", "title": "Daily AI/Dev Brief - 2026-06-04", "htmlUrl": "briefs/2026-06-04.html"}, {"stamp": "2026-06-03", "title": "Daily AI/Dev Brief - 2026-06-03", "htmlUrl": "briefs/2026-06-03.html"}, {"stamp": "2026-06-02", "title": "Daily AI/Dev Brief - 2026-06-02", "htmlUrl": "briefs/2026-06-02.html"}, {"stamp": "2026-06-01", "title": "Daily AI/Dev Brief - 2026-06-01", "htmlUrl": "briefs/2026-06-01.html"}, {"stamp": "2026-05-31", "title": "Daily AI/Dev Brief - 2026-05-31", "htmlUrl": "briefs/2026-05-31.html"}, {"stamp": "2026-05-30", "title": "Daily AI/Dev Brief - 2026-05-30", "htmlUrl": "briefs/2026-05-30.html"}, {"stamp": "2026-05-29", "title": "Daily AI/Dev Brief - 2026-05-29", "htmlUrl": "briefs/2026-05-29.html"}, {"stamp": "2026-05-28", "title": "Daily AI/Dev Brief - 2026-05-28", "htmlUrl": "briefs/2026-05-28.html"}];
    const list = document.getElementById('brief-list');
    const viewer = document.getElementById('viewer');
    const menu = document.getElementById('menu');
    const backdrop = document.getElementById('backdrop');

    function setNav(open) {
      document.body.classList.toggle('nav-open', open);
    }

    function showBrief(brief, button) {
      document.querySelectorAll('.brief-link').forEach((item) => item.removeAttribute('aria-current'));
      if (button) button.setAttribute('aria-current', 'true');
      const iframe = document.createElement('iframe');
      iframe.title = brief.title || brief.stamp;
      iframe.src = brief.htmlUrl;
      viewer.replaceChildren(iframe);
      setNav(false);
    }

    function renderList() {
      if (!briefs.length) {
        list.innerHTML = '<div class="empty">아직 생성된 브리프가 없습니다. Actions를 수동 실행하거나 다음 예약 실행을 기다려주세요.</div>';
        viewer.innerHTML = '<div class="empty">아직 생성된 브리프가 없습니다.</div>';
        return;
      }
      briefs.forEach((brief, index) => {
        const button = document.createElement('button');
        button.className = 'brief-link';
        button.type = 'button';
        button.innerHTML = `${brief.stamp}<span>저장된 브리프</span>`;
        button.addEventListener('click', () => showBrief(brief, button));
        list.appendChild(button);
        if (index === 0) showBrief(brief, button);
      });
    }

    menu.addEventListener('click', () => setNav(true));
    backdrop.addEventListener('click', () => setNav(false));
    renderList();
  </script>
</body>
</html>
